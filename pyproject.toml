[project]
name = "vidtoolz-ljcut"
version = "0.1.0"
description = "L-cut J-cut using moviepy"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-ljcut"
Changelog = "https://github.com/sukhbinder/vidtoolz-ljcut/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-ljcut/issues"
CI = "https://github.com/sukhbinder/vidtoolz-ljcut/actions"

[project.entry-points."vidtoolz_plugins"]
jcut = "vidtoolz_ljcut:jcut_plugin"
lcut = "vidtoolz_ljcut:lcut_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
